[project]
name = "serviceiq-backend"
version = "0.1.0"
description = "ServiceIQ — AI-Powered Enterprise Service Intelligence Platform"
requires-python = ">=3.11"

dependencies = [
    "asyncpg>=0.29.0",
    "starlette>=0.41.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
]
